
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skin Care Product Card</title>
  <link rel="stylesheet" href="../../../static/css/product details/productDetails.css">
</head>
<body>
  <div class="product-card">
 
    <div class="product-image">
      <img src="../../../static/images/skincare/Oily_sunscreen/product-1.webp" alt="Skin Care Product">
    </div>

    <div class="product-details">
      <h1>tinted fluid sunscreen</h1>
      <p class="company"><span>Company:-</span>Foxtale</p>
      <p class="description">
        <span class="des">Description:- </span>
FoxTale's Perfect Match Tinted Fluid Sunscreen offers SPF 50 protection, prevents tanning, blurs pores, and brightens the skin, suitable for all skin types.
      </p>


      <div class="small-images">
          <div><img src="../../../static/images/skincare/Oily_sunscreen/product-1.webp" alt="Small 1"></div>
       

      </div>

      <div class="rating" id="rating">
        <span data-value="1">&#9733;</span>
        <span data-value="2">&#9733;</span>
        <span data-value="3">&#9733;</span>
        <span data-value="4">&#9733;</span>
        <span data-value="5">&#9733;</span>
      </div>

      <div class="buttons">
        <button class="buy-btn">Buy Now</button>
        <button class="cart-btn">Add to Cart</button>
      </div>
    </div>
  </div>

  <script src="../../../static/js/product Details/ProductDetails.js"></script>
</body>
</html>
